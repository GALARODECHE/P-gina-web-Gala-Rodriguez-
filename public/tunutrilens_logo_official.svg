<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient matching uploaded icon -->
    <linearGradient id="bgIconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a9154" />
      <stop offset="40%" stop-color="#1e7b44" />
      <stop offset="100%" stop-color="#10572d" />
    </linearGradient>

    <!-- Circular Badge Outer Shadow / Glow -->
    <radialGradient id="outerPlateGrad" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#46af69" />
      <stop offset="65%" stop-color="#228547" />
      <stop offset="100%" stop-color="#0f5027" />
    </radialGradient>

    <!-- Outer Rim Metallic Chamfer -->
    <linearGradient id="rimChamfer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7be69e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1b723d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#093d1d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Stepped Concentric Vortex Lens Rings (Natural Green Tones, No Harsh White) -->
    <linearGradient id="ringLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a6eec1" />
      <stop offset="35%" stop-color="#72d698" />
      <stop offset="70%" stop-color="#349d5c" />
      <stop offset="100%" stop-color="#1b6338" />
    </linearGradient>

    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#329e58" />
      <stop offset="50%" stop-color="#1d6c38" />
      <stop offset="100%" stop-color="#0c3c1e" />
    </linearGradient>

    <!-- Center Sensor Glass / Pupil Gradient -->
    <radialGradient id="sensorGlass" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#1b5c3d" />
      <stop offset="45%" stop-color="#0c3521" />
      <stop offset="85%" stop-color="#041a10" />
      <stop offset="100%" stop-color="#010c07" />
    </radialGradient>

    <!-- Fresh Leaf Foliage Gradient (Organic, soft tonal shading) -->
    <linearGradient id="leafBodyGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8ceba9" />
      <stop offset="30%" stop-color="#49ca72" />
      <stop offset="70%" stop-color="#24964c" />
      <stop offset="100%" stop-color="#135f2d" />
    </linearGradient>

    <!-- Gold Sparkles -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe685" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Curved Text Path for TUNUTRILENS -->
    <path id="textArc" d="M 124 286 A 148 148 0 0 0 388 286" />
  </defs>

  <!-- Squircle App Icon Base with rounded corners -->
  <rect width="512" height="512" rx="114" fill="url(#bgIconGrad)" />

  <!-- Inner Elevated Disc (Circular badge with soft drop shadow) -->
  <circle cx="256" cy="254" r="212" fill="#083a1c" opacity="0.45" />
  <circle cx="256" cy="250" r="212" fill="url(#outerPlateGrad)" />
  <circle cx="256" cy="250" r="212" fill="none" stroke="url(#rimChamfer)" stroke-width="6" />

  <!-- Top Right Sparkle & Magic Lens Flairs -->
  <g>
    <!-- Curved gold flair arc -->
    <path d="M 302 142 C 342 144 374 164 394 220" fill="none" stroke="url(#goldStar)" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    
    <!-- Primary 4-pointed golden sparkle -->
    <path d="M 364 164 Q 364 146 370 140 Q 364 134 364 116 Q 364 134 358 140 Q 364 146 364 164 Z" fill="url(#goldStar)" />
    <path d="M 340 140 Q 358 140 364 134 Q 370 140 388 140 Q 370 140 364 146 Q 358 140 340 140 Z" fill="url(#goldStar)" />
    <circle cx="364" cy="140" r="3.5" fill="#ffffff" />

    <!-- Secondary small sparkle -->
    <path d="M 396 178 Q 396 168 400 164 Q 396 160 396 150 Q 396 160 392 164 Q 396 168 396 178 Z" fill="#ffd766" opacity="0.85" />
    <path d="M 382 164 Q 392 164 396 160 Q 400 164 410 164 Q 400 164 396 168 Q 392 164 382 164 Z" fill="#ffd766" opacity="0.85" />

    <!-- Ambient twinkle dots -->
    <circle cx="328" cy="128" r="3.5" fill="#ffd766" />
    <circle cx="390" cy="138" r="3" fill="#ffd766" />
  </g>

  <!-- Concentric Camera Lens Structure (Smooth green shaded rings, no white stripes) -->
  <g id="camera-lens">
    <!-- Deepest outer ring trough -->
    <circle cx="258" cy="246" r="126" fill="#0c4222" stroke="#1b6336" stroke-width="6" />

    <!-- Swirling vortex grooves with organic green transitions -->
    <circle cx="258" cy="246" r="114" fill="none" stroke="url(#ringMid)" stroke-width="12" />
    <circle cx="258" cy="246" r="102" fill="none" stroke="#25894b" stroke-width="8" />
    <circle cx="258" cy="246" r="92" fill="none" stroke="url(#ringLight)" stroke-width="14" />
    
    <!-- Inner emerald steps -->
    <circle cx="258" cy="246" r="74" fill="none" stroke="#165d33" stroke-width="10" />
    <circle cx="258" cy="246" r="62" fill="none" stroke="#32a760" stroke-width="6" opacity="0.8" />
    
    <!-- Central sensor pupil (dark camera optics) -->
    <circle cx="258" cy="246" r="54" fill="url(#sensorGlass)" />
    <circle cx="258" cy="246" r="54" fill="none" stroke="#0e3d23" stroke-width="4" />
    
    <!-- Aperture inner circle reflection -->
    <circle cx="258" cy="246" r="36" fill="none" stroke="#2db163" stroke-width="2.5" opacity="0.5" />
    <circle cx="258" cy="246" r="22" fill="#041a10" />

    <!-- Soft Glass Highlights -->
    <ellipse cx="242" cy="226" rx="12" ry="7" transform="rotate(-35 242 226)" fill="#ffffff" opacity="0.5" />
    <circle cx="254" cy="242" r="3" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Botanical Leaf Element (Clean, organic green leaf with subtle tone-on-tone veins, NO white stripes) -->
  <g id="botanical-leaf">
    <!-- Main Leaf Body Gradient with subtle darker border -->
    <path d="M 274 135 C 222 140 176 172 154 218 C 134 260 140 306 172 340 C 204 374 256 384 300 368 C 252 374 200 354 176 320 C 152 288 150 252 166 220 C 186 180 234 148 274 135 Z"
      fill="url(#leafBodyGrad)" stroke="#115528" stroke-width="2" />

    <!-- Upright Leaf Blade Tip (Vertical leaf curling upwards) -->
    <path d="M 276 137 C 262 106 232 72 192 82 C 158 92 142 128 144 166 C 146 208 170 246 206 266 C 178 242 162 210 162 174 C 162 140 176 112 204 104 C 234 94 258 120 276 137 Z"
      fill="url(#leafBodyGrad)" stroke="#115528" stroke-width="2" />

    <!-- Subtle, soft organic mint veins (smooth tonal integration, no white) -->
    <path d="M 270 138 C 232 136 188 160 164 196 C 146 224 142 260 156 294"
      fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    <path d="M 194 88 C 180 118 174 152 178 190"
      fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.45" />
    
    <!-- Gentle lateral veins -->
    <path d="M 198 120 C 208 130 220 136 234 138" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" opacity="0.35" />
    <path d="M 184 146 C 196 156 210 160 226 160" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" opacity="0.35" />
    <path d="M 174 176 C 188 184 200 186 214 184" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" opacity="0.35" />
    <path d="M 166 210 C 180 216 194 216 206 212" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" opacity="0.35" />
  </g>

  <!-- Bottom Arch Typography: TUNUTRILENS in Bold Crisp Pure White -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        font-size="33"
        fill="#ffffff"
        letter-spacing="5">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      TUNUTRILENS
    </textPath>
  </text>

  <!-- Elegant Organic White Rubric (Trazo blanco más grueso y orgánico que rubrica el nombre) -->
  <g id="brand-rubric">
    <path d="M 116 296 C 144 350 196 388 256 388 C 316 388 368 350 396 296 C 399 301 397 308 390 314 C 360 361 312 379 256 379 C 200 379 152 361 122 314 C 115 308 113 301 116 296 Z"
          fill="#ffffff" />
  </g>
</svg>
